name: Release and Deploy

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build Source/WorkbenchConnect/WorkbenchConnect.csproj --configuration Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkbenchConnect-Assemblies
          path: Assemblies/WorkbenchConnect.dll

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: WorkbenchConnect-Assemblies
          path: Assemblies

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Assemblies/WorkbenchConnect.dll

  steam-deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    environment: steam-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: WorkbenchConnect-Assemblies
          path: Assemblies

      - name: Deploy to Steam Workshop
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          password: ${{ secrets.STEAM_PASSWORD }}
          totp: ${{ secrets.STEAM_TOTP_SECRET }}
          appId: 294100
          publishedFileId: 3524727262
          path: .
