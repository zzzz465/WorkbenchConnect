name: CI

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build Source/WorkbenchConnect/WorkbenchConnect.csproj --configuration Release
